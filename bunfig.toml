[test]
preload = ["./tooling/test-support/preload.ts"]
# PGlite WASM cold-start on GitHub Actions often exceeds Bun's 5s default.
timeout = 30_000
pathIgnorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "package/api-client/**",
  "tooling/integration-tests/**",
]
coverageThreshold = 0
coveragePathIgnorePatterns = [
  "**/index.ts",
  "package/api-client/**",
  "tooling/integration-tests/**",
]
coverageReporters = [
  "lcov",
]
