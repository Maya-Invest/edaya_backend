name: Integration tests

on:
  workflow_call:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Integration tests (api + http slices)
        run: bun run test:integration
