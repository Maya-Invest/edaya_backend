name: Integration tests

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout identity client
        uses: ./.github/actions/checkout-identity-client
        with:
          ref: ${{ vars.IDENTITY_REF || ((github.head_ref || github.ref_name) == 'staging' && 'staging' || (github.head_ref || github.ref_name) == 'main' && 'main' || 'dev') }}
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Integration tests (api + http slices)
        run: bun run test:integration
