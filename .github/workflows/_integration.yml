name: Full backend integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-bun-turbo
      - name: Locate PostgreSQL before seed and native tests
        run: |
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Service and HTTP integrations
        if: ${{ !cancelled() }}
        run: bun run test:integration
      - name: Seed HTTP integrations
        if: ${{ !cancelled() }}
        run: bun run test:integration:seed
      - name: Native PostgreSQL integrations
        if: ${{ !cancelled() }}
        run: bun run test:integration:native
