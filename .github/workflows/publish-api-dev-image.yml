name: Publish API dev image

on:
  push:
    branches: [main, master, staging]
    paths:
      - .dockerignore
      - apps/**
      - package/**
      - tooling/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json

concurrency:
  group: publish-api-dev-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/edaya-api-dev"
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            main|master)
              CHANNEL=production
              ;;
            *)
              CHANNEL=staging
              ;;
          esac
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tooling/api-dev-container/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-consumers:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository:
          - Maya-Invest/edaya_web
          - Maya-Invest/edaya_mobile
    steps:
      - name: Notify consumer repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_PAT }}
          repository: ${{ matrix.repository }}
          event-type: api-dev-image-published
          client-payload: >-
            {
              "channel": "${{ needs.publish.outputs.channel }}",
              "sha": "${{ github.sha }}",
              "image": "${{ needs.publish.outputs.image }}"
            }
