name: Migrate database

on:
  push:
    branches: [main, master, staging]

concurrency:
  group: db-migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve migration target
        id: target
        run: |
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            main|master)
              echo "migrate_target=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "migrate_target=staging" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Migrate school + auth schema
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: bun repo db migrate ${{ steps.target.outputs.migrate_target }}
