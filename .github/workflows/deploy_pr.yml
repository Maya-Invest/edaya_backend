name: Pull request
on:
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  quality:
    needs: source
    uses: ./.github/workflows/_quality-check.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
  unit:
    needs: source
    uses: ./.github/workflows/_unit-test.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
  build:
    needs: source
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
  integration:
    needs: [source, quality, unit]
    uses: ./.github/workflows/_integration-test.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
      baseline_sha: ${{ github.event.pull_request.base.sha || '' }}
  qualification:
    name: Full validation
    if: always()
    needs: [source, quality, unit, build, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every task to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          source_sha: ${{ needs.source.outputs.sha }}
      - uses: ./.github/actions/finalize
        with:
          target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
