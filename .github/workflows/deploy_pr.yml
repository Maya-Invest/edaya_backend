name: Pull request

on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  integration:
    uses: ./.github/workflows/_integration.yml

  qualification:
    name: Full validation
    needs: [verify, integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require every qualification job to succeed
        run: python3 .github/scripts/ci_support.py gate verify="$VERIFY_RESULT" integration="$INTEGRATION_RESULT"
