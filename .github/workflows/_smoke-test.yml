name: Smoke test staging

on:
  workflow_call:
    inputs:
      channel:
        description: Deploy channel (smoke runs only for staging)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.channel == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Smoke test staging API
        env:
          SMOKE_STAGING_LOAD_ENV_FILE: '0'
          SEED_STAGING_API_URL: https://staging.api.edayaplus.com
          SEED_STAGING_APP_ORIGIN: https://staging.app.edayaplus.com
        run: bun repo smoke-test staging
