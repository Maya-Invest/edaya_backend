name: Notify API dev image consumers

on:
  workflow_call:
    inputs:
      channel:
        description: Published image channel
        required: true
        type: string
      image:
        description: Published image name without tag
        required: true
        type: string
      sha:
        description: Source commit SHA
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository:
          - Maya-Invest/edaya_web
          - Maya-Invest/edaya_mobile
    steps:
      - name: Notify consumer repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_PAT }}
          repository: ${{ matrix.repository }}
          event-type: api-dev-image-published
          client-payload: >-
            {
              "channel": "${{ inputs.channel }}",
              "sha": "${{ inputs.sha }}",
              "image": "${{ inputs.image }}"
            }
