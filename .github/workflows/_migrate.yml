name: Migrate database

on:
  workflow_call:
    inputs:
      migrate_target:
        description: Migration target (staging or production)
        required: true
        type: string
    secrets:
      STAGING_DATABASE_URL:
        required: false
      PRODUCTION_DATABASE_URL:
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Validate migration secrets
        env:
          MIGRATE_TARGET: ${{ inputs.migrate_target }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          missing=
          case "$MIGRATE_TARGET" in
            staging)
              [ -z "$STAGING_DATABASE_URL" ] && missing=STAGING_DATABASE_URL
              ;;
            production)
              [ -z "$PRODUCTION_DATABASE_URL" ] && missing=PRODUCTION_DATABASE_URL
              ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret: $missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Migrate school + auth schema
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: bun repo db migrate ${{ inputs.migrate_target }}
