name: Migrate database

on:
  workflow_call:
    inputs:
      migrate_target:
        description: Migration target (staging or production)
        required: true
        type: string
    secrets:
      PRODUCTION_DATABASE_URL:
        required: false
      PRODUCTION_AUTH_DATABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration secrets
        env:
          MIGRATE_TARGET: ${{ inputs.migrate_target }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}
        run: |
          missing=
          case "$MIGRATE_TARGET" in
            staging)
              echo "Use the staging release coordinator" >&2
              exit 1
              ;;
            production)
              [ -z "$PRODUCTION_DATABASE_URL" ] && missing=PRODUCTION_DATABASE_URL
              [ -z "$PRODUCTION_AUTH_DATABASE_URL" ] && missing=PRODUCTION_AUTH_DATABASE_URL
              ;;
            *) echo "Unknown migration target" >&2; exit 1 ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret: $missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Migrate school schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}
          MIGRATE_TARGET: ${{ inputs.migrate_target }}
        run: bun repo db migrate school "$MIGRATE_TARGET"

      - name: Migrate Account and auth provider schemas
        env:
          PRODUCTION_AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}
        run: bun repo db migrate identity production
