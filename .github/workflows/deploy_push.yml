name: Push / Merge deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      channel:
        description: Deploy channel
        type: choice
        options: [staging, production]
        default: staging
      web_ref:
        description: Web revision for coordinated staging release
        type: string
        default: dev
      mobile_ref:
        description: Mobile revision for coordinated staging release
        type: string
        default: dev
      validate_only:
        description: Validate staging without publication or live changes
        type: boolean
        default: false
      reset_data:
        description: Reset and reseed staging data (destructive)
        type: boolean
        default: false
      run_migrate:
        description: Run database migrations
        type: boolean
        default: true
      deploy_api:
        description: Deploy API Worker to Cloudflare
        type: boolean
        default: true
      run_publish_api_dev:
        description: Build and publish edaya-api-dev image
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'staging'
    uses: ./.github/workflows/_verify.yml
    secrets: inherit

  integration:
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'production')
    uses: ./.github/workflows/_integration.yml

  qualification:
    name: Full validation
    needs: [gate, verify, integration]
    if: always() && ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GATE_RESULT: ${{ needs.gate.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require every qualification job to succeed
        run: python3 .github/scripts/ci_support.py gate gate="$GATE_RESULT" verify="$VERIFY_RESULT" integration="$INTEGRATION_RESULT"

  gate:
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      run_migrate: ${{ steps.plan.outputs.run_migrate }}
      deploy_api: ${{ steps.plan.outputs.deploy_api }}
      run_publish_api_dev: ${{ steps.plan.outputs.run_publish_api_dev }}
      migrate_target: ${{ steps.plan.outputs.migrate_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject validation outside staging
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: |
          echo "validate_only is available only for the coordinated staging workflow" >&2
          exit 1

      - name: Detect deploy changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api_deploy:
              - apps/api/**
              - tooling/repo/**
              - scripts/**
              - release-contract.json
              - package/**
              - package.json
              - bun.lock
              - turbo.json
              - .github/workflows/**
              - .github/actions/**
              - .github/scripts/**
            api_dev_image:
              - .dockerignore
              - apps/**
              - package/**
              - tooling/**
              - package.json
              - bun.lock
              - bunfig.toml
              - turbo.json

      - name: Plan jobs
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            echo "run_migrate=${{ inputs.run_migrate }}" >> "$GITHUB_OUTPUT"
            echo "deploy_api=${{ inputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "run_publish_api_dev=${{ inputs.run_publish_api_dev }}" >> "$GITHUB_OUTPUT"
          else
            case "$REF_NAME" in
              main|master) CHANNEL=production ;;
              *) CHANNEL=staging ;;
            esac
            echo "run_migrate=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api=${{ steps.filter.outputs.api_deploy == 'true' }}" >> "$GITHUB_OUTPUT"
            echo "run_publish_api_dev=${{ steps.filter.outputs.api_dev_image == 'true' }}" >> "$GITHUB_OUTPUT"
          fi

          case "$CHANNEL" in
            production) MIGRATE_TARGET=production ;;
            *) MIGRATE_TARGET=staging ;;
          esac
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "migrate_target=${MIGRATE_TARGET}" >> "$GITHUB_OUTPUT"

  migrate:
    needs: [gate, qualification]
    if: needs.gate.outputs.channel == 'production' && needs.gate.outputs.run_migrate == 'true'
    uses: ./.github/workflows/_migrate.yml
    with:
      migrate_target: ${{ needs.gate.outputs.migrate_target }}
    secrets:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}

  publish-api-dev-image:
    permissions:
      contents: read
      packages: write
    needs: [gate, qualification]
    if: needs.gate.outputs.channel == 'production' && needs.gate.outputs.run_publish_api_dev == 'true'
    uses: ./.github/workflows/_publish-api-dev-image.yml
    secrets: inherit

  publish-api-client:
    permissions:
      contents: read
      packages: write
    needs: [gate, qualification]
    if: needs.gate.outputs.channel == 'production'
    uses: ./.github/workflows/_publish-api-client.yml
    secrets: inherit

  deploy-api:
    needs: [gate, qualification, migrate]
    if: >-
      always() &&
      needs.qualification.result == 'success' &&
      needs.gate.outputs.channel == 'production' &&
      needs.gate.outputs.deploy_api == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    uses: ./.github/workflows/_deploy-api.yml
    with:
      channel: ${{ needs.gate.outputs.channel }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  staging-release:
    permissions:
      actions: read
      contents: read
      packages: write
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'staging'
    uses: ./.github/workflows/release-staging.yml
    with:
      web_ref: ${{ inputs.web_ref }}
      mobile_ref: ${{ inputs.mobile_ref }}
      reset_data: ${{ inputs.reset_data }}
      validate_only: ${{ inputs.validate_only }}
    secrets: inherit
