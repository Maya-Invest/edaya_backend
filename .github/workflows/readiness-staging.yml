name: Staging repository readiness

on:
  workflow_dispatch:
    inputs:
      web_sha:
        description: Exact frontend commit (40-character SHA)
        type: string
        required: true
      mobile_sha:
        description: Exact mobile commit (40-character SHA)
        type: string
        required: true

concurrency:
  group: staging-readiness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_ROOT: ${{ github.workspace }}
      VALIDATE_ONLY: 'true'
      RESET_DATA: 'false'
      RELEASE_TARGET: staging
      REPOSITORY_READINESS: 'true'
      CI: 'true'
    steps:
      - name: Require immutable client commits
        env:
          WEB_SHA: ${{ inputs.web_sha }}
          MOBILE_SHA: ${{ inputs.mobile_sha }}
        run: |
          [[ "$WEB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MOBILE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: edaya_backend
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@maya-invest'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install backend configuration dependencies
        working-directory: edaya_backend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Checkout web candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Maya-Invest/edaya_web
          ref: ${{ inputs.web_sha }}
          path: edaya_frontend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Checkout mobile candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Maya-Invest/edaya_mobile
          ref: ${{ inputs.mobile_sha }}
          path: edaya_mobile
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Install pinned Melos and locate PostgreSQL
        run: |
          dart pub global activate melos 8.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Restore existing Android signing material
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.STAGING_ANDROID_SIGNING_BUNDLE }}
        run: node edaya_backend/.github/scripts/staging-artifacts.mjs signing
      - name: Qualify repositories and build staging artifacts without live access
        run: bash edaya_backend/.github/scripts/readiness-staging.sh
      - name: Record incomplete readiness without claiming success
        if: failure()
        env:
          RELEASE_STATUS: failed
        run: node edaya_backend/.github/scripts/staging-manifest.mjs
      - name: Upload redacted readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-readiness-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            release/manifest.json
            release/qualification.json
            release/qualification-passed.txt
            release/bootstrap-rehearsal.json
            release/browser-integration.json
            release/mobile-integration.json
            release/mobile-staging-runner/summary.json
            edaya_mobile/release-apks/apk-source.json
            edaya_mobile/release-apks/signatures.json
            edaya_mobile/release-apks/SHA256SUMS
      - name: Upload verified staging builds
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-ready-builds-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release/builds/
            edaya_mobile/release-apks/edaya-guardian-staging.apk
            edaya_mobile/release-apks/edaya-teacher-staging.apk
      - name: Remove signing and fixture credentials
        if: always()
        run: node edaya_backend/.github/scripts/staging-artifacts.mjs cleanup
