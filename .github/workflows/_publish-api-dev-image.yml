name: Publish API dev image

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: false
    outputs:
      channel:
        description: Published image channel (staging or production)
        value: ${{ jobs.publish.outputs.channel }}
      image:
        description: Published image name without tag
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout identity client
        uses: ./.github/actions/checkout-identity-client
        with:
          ref: ${{ vars.IDENTITY_REF || ((github.head_ref || github.ref_name) == 'staging' && 'staging' || (github.head_ref || github.ref_name) == 'main' && 'main' || 'dev') }}
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN || github.token }}

      - name: Copy identity into the Docker build context
        run: bash tooling/api-dev-container/prepare-identity-client.sh

      - name: Resolve image tags
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/edaya-api-dev"
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            main|master)
              CHANNEL=production
              ;;
            *)
              CHANNEL=staging
              ;;
          esac
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tooling/api-dev-container/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
