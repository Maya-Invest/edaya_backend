name: Branch push

on:
  push:
    branches-ignore:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: branch-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
  publish_api_client:
    uses: ./.github/workflows/_publish-api-client.yml
    
