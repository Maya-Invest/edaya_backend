name: Branch push

on:
  push:
    branches-ignore:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: branch-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  packages: write

  
jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    secrets: inherit

  publish-api-client:
    needs: verify
    if: github.ref_name != 'staging'
    uses: ./.github/workflows/_publish-api-client.yml
    secrets: inherit
