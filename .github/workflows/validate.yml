name: Manual validation
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      source_ref:
        description: Source revision (empty uses selected workflow revision)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  quality:
    needs: source
    uses: ./.github/workflows/_quality-check.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ inputs.target }}
  unit:
    needs: source
    uses: ./.github/workflows/_unit-test.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ inputs.target }}
  build:
    needs: source
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ inputs.target }}
  integration:
    needs: [source, quality, unit]
    uses: ./.github/workflows/_integration-test.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      target: ${{ inputs.target }}
      baseline_sha: ${{ github.event.pull_request.base.sha || '' }}
  qualification:
    name: Full validation
    if: always()
    needs: [source, quality, unit, build, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every task to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          source_sha: ${{ needs.source.outputs.sha }}
      - uses: ./.github/actions/finalize
        with:
          target: ${{ inputs.target }}
