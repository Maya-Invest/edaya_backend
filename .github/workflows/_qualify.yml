name: Qualification
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      backend_ref:
        type: string
        default: ''
      full:
        type: boolean
        default: true
      baseline_sha:
        type: string
        default: ''
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: false
permissions:
  contents: read
  deployments: read
jobs:
  qualification:
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: 'true'
      COMPATIBILITY_BASE_SHA: ${{ inputs.baseline_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run repo ci setup
      - name: Verify candidate
        env:
          TARGET: ${{ inputs.target }}
        if: inputs.full
        run: bun run repo ci qualify "$TARGET"
      - name: Verify branch
        if: ${{ !inputs.full }}
        run: bun run repo ci verify
      - name: Save frozen build dependencies
        if: inputs.full
        run: bun run repo ci archive-inputs
      - name: Upload qualified candidate
        if: inputs.full
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/
            .generated/
            .ci-evidence/
      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: .ci-evidence/
