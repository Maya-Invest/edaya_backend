name: Full-stack staging release

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: Web ref (resolved once)
        type: string
        default: dev
      mobile_ref:
        description: Mobile ref (resolved once)
        type: string
        default: dev
      validate_only:
        description: Qualify and build without publication or live changes
        type: boolean
        default: false
      reset_data:
        description: Reset and reseed staging databases
        type: boolean
        default: false
  workflow_call:
    inputs:
      web_ref:
        type: string
        required: true
      mobile_ref:
        type: string
        required: true
      validate_only:
        type: boolean
        default: false
      reset_data:
        type: boolean
        default: false

concurrency:
  group: edaya-full-stack-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 180
    env:
      RELEASE_ROOT: ${{ github.workspace }}
      RELEASE_TARGET: staging
      VALIDATE_ONLY: ${{ inputs.validate_only && 'true' || 'false' }}
      RESET_DATA: ${{ inputs.reset_data && 'true' || 'false' }}
      CLOUDFLARE_ACCOUNT_ID: ca013c820d015639e8769dc09e2566ec
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: edaya_backend
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@maya-invest'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install backend configuration dependencies
        working-directory: edaya_backend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check configuration before cross-repository checkout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_AUTH_DATABASE_URL: ${{ secrets.STAGING_AUTH_DATABASE_URL }}
          STAGING_API_SECRETS: ${{ secrets.STAGING_API_SECRETS }}
          STAGING_IDENTITY_SECRETS: ${{ secrets.STAGING_IDENTITY_SECRETS }}
          STAGING_NEON_TARGET_CONFIRMED: ${{ vars.STAGING_NEON_TARGET_CONFIRMED }}
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          ANDROID_SIGNING_BUNDLE: ${{ secrets.STAGING_ANDROID_SIGNING_BUNDLE }}
        run: node edaya_backend/.github/scripts/staging-preflight.mjs --configuration-only
      - name: Checkout web candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Maya-Invest/edaya_web
          ref: ${{ inputs.web_ref }}
          path: edaya_frontend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Checkout mobile candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Maya-Invest/edaya_mobile
          ref: ${{ inputs.mobile_ref }}
          path: edaya_mobile
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Install pinned Melos and locate PostgreSQL
        run: |
          dart pub global activate melos 8.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Read-only infrastructure and credential preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_AUTH_DATABASE_URL: ${{ secrets.STAGING_AUTH_DATABASE_URL }}
          STAGING_API_SECRETS: ${{ secrets.STAGING_API_SECRETS }}
          STAGING_IDENTITY_SECRETS: ${{ secrets.STAGING_IDENTITY_SECRETS }}
          STAGING_NEON_TARGET_CONFIRMED: ${{ vars.STAGING_NEON_TARGET_CONFIRMED }}
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          ANDROID_SIGNING_BUNDLE: ${{ secrets.STAGING_ANDROID_SIGNING_BUNDLE }}
        run: |
          cd edaya_backend
          bun install --frozen-lockfile
          node .github/scripts/staging-preflight.mjs
      - name: Record the three immutable candidate commits
        id: candidate
        run: node edaya_backend/.github/scripts/staging-manifest.mjs
      - name: Qualify candidate before publication or staging changes
        run: bash edaya_backend/.github/scripts/qualify-staging.sh
      - name: Publish or reuse matching API client
        if: ${{ !inputs.validate_only }}
        working-directory: edaya_backend
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-client.mjs package/api-client staging
      - name: Verify web against the exact published API client and build staging assets
        working-directory: edaya_frontend
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PUBLIC_API_URL: https://staging.api.edayaplus.com
          PUBLIC_APP_ENV: staging
          PUBLIC_TEST_OTP_ACCESS: 'false'
        run: |
          if [ "$VALIDATE_ONLY" = false ]; then
            API_CLIENT_VERSION="0.0.0-staging.$(git -C ../edaya_backend rev-parse HEAD)" node .github/scripts/ci-use-published-api-client.mjs
            bun install
          else
            bun install --frozen-lockfile
          fi
          bun run verify
          bun --filter @edaya/webapp deploy:staging:dry-run
          bun --filter @edaya/webadmin deploy:staging:dry-run
      - name: Restore existing Android signing material
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.STAGING_ANDROID_SIGNING_BUNDLE }}
        run: node edaya_backend/.github/scripts/staging-artifacts.mjs signing
      - name: Download prepared APKs from an earlier attempt
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-prepared-apks-${{ github.run_id }}
          path: .release-private/retry-apks
      - name: Reuse only artifacts matching the immutable candidate and Firebase configuration
        id: apk_reuse
        run: node edaya_backend/.github/scripts/staging-apk-reuse.mjs restore
      - name: Build both signed staging APKs
        if: steps.apk_reuse.outputs.hit != 'true'
        working-directory: edaya_mobile
        run: bash scripts/build-staging-apks.sh
      - name: Verify both APKs against the existing signing keys and record provenance
        run: |
          node edaya_mobile/scripts/verify-staging-apks.mjs
          node edaya_backend/.github/scripts/staging-apk-reuse.mjs record
      - name: Preserve prepared APKs for retries before staging changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-prepared-apks-${{ github.run_id }}
          path: edaya_mobile/release-apks/
          if-no-files-found: error
          overwrite: true
      - name: Record prepared artifacts
        run: node edaya_backend/.github/scripts/staging-manifest.mjs
      - name: Deploy, bootstrap, smoke-test, and observe staging
        if: ${{ !inputs.validate_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_AUTH_DATABASE_URL: ${{ secrets.STAGING_AUTH_DATABASE_URL }}
          STAGING_API_SECRETS: ${{ secrets.STAGING_API_SECRETS }}
          STAGING_IDENTITY_SECRETS: ${{ secrets.STAGING_IDENTITY_SECRETS }}
          STAGING_NEON_TARGET_CONFIRMED: ${{ vars.STAGING_NEON_TARGET_CONFIRMED }}
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          ANDROID_SIGNING_BUNDLE: ${{ secrets.STAGING_ANDROID_SIGNING_BUNDLE }}
        run: node edaya_backend/.github/scripts/staging-deploy.mjs
      - name: Collect browser evidence even when qualification fails
        if: always()
        run: |
          if test -d edaya_frontend/apps/webapp; then
            cd edaya_frontend
            python3 .github/scripts/ci_support.py evidence --role web
            cp .ci-evidence/results.json ../release/browser-integration.json
          fi
      - name: Record final release status
        if: always() && steps.candidate.outcome == 'success'
        env:
          RELEASE_STATUS: ${{ job.status }}
        run: node edaya_backend/.github/scripts/staging-manifest.mjs
      - name: Upload guardian APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edaya-guardian-staging-${{ github.run_id }}
          path: edaya_mobile/release-apks/edaya-guardian-staging.apk
          if-no-files-found: error
          overwrite: true
      - name: Upload teacher APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edaya-teacher-staging-${{ github.run_id }}
          path: edaya_mobile/release-apks/edaya-teacher-staging.apk
          if-no-files-found: error
          overwrite: true
      - name: Upload manifest and test evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-release-evidence-${{ github.run_id }}
          path: |
            release/manifest.json
            release/preflight.json
            release/browser-integration.json
            release/mobile-integration.json
            release/bootstrap-rehearsal.json
            release/qualification-passed.txt
            release/worker-versions.json
          if-no-files-found: warn
          overwrite: true
      - name: Remove signing and fixture credentials
        if: always()
        run: node edaya_backend/.github/scripts/staging-artifacts.mjs cleanup
