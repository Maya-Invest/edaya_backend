name: Deploy unified API Worker

on:
  workflow_call:
    inputs:
      channel:
        description: Deploy channel (staging or production)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CHANNEL: ${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "$CHANNEL" in
            production) bun run deploy:production ;;
            *) echo "Use the staging release coordinator" >&2; exit 1 ;;
          esac
