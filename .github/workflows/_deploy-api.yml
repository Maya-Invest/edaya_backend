name: Deploy unified API Worker

on:
  workflow_call:
    inputs:
      channel:
        description: Deploy channel (staging or production)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      IDENTITY_CHECKOUT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ inputs.channel }}" in
            production) bun run deploy:production ;;
            *) echo "Use the staging release coordinator" >&2; exit 1 ;;
          esac
