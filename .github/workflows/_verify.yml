name: Verify

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: false

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout identity client
        uses: ./.github/actions/checkout-identity-client
        with:
          ref: ${{ vars.IDENTITY_REF || ((github.head_ref || github.ref_name) == 'staging' && 'staging' || (github.head_ref || github.ref_name) == 'main' && 'main' || 'dev') }}
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN || github.token }}

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Verify
        run: bun run verify

      - name: Integration and seed authentication
        run: |
          bun run test:integration
          bun run test:integration:seed

      - name: Locate PostgreSQL test binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Disposable native PostgreSQL tests
        run: bun run test:integration:native
