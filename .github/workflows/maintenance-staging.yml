name: Staging maintenance
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [reset-reseed, recover]
        default: reset-reseed
      dry_run:
        type: boolean
        default: true
      confirmation:
        description: Type STAGING MAINTENANCE to apply changes
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Guarded maintenance
        env:
          MAINTENANCE_OPERATION: ${{ inputs.operation }}
          MAINTENANCE_DRY_RUN: ${{ inputs.dry_run }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_AUTH_DATABASE_URL: ${{ secrets.STAGING_AUTH_DATABASE_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SCHOOL_DATABASE: ${{ vars.STAGING_SCHOOL_DATABASE }}
          STAGING_IDENTITY_DATABASE: ${{ vars.STAGING_IDENTITY_DATABASE }}
          STAGING_IDENTITY_ROLE: ${{ vars.STAGING_IDENTITY_ROLE }}
          STAGING_IDENTITY_SECRETS: ${{ secrets.STAGING_IDENTITY_SECRETS }}
        run: bun run repo ci maintenance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci-evidence/maintenance.json
