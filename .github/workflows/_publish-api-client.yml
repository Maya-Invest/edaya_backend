name: Publish API client

on:
  workflow_call:
    outputs:
      channel:
        description: Qualified production client channel
        value: ${{ jobs.publish.outputs.channel }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve channel
        id: meta
        run: |
          CHANNEL=production
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Publishing @maya-invest/edaya-api-client with tag ${CHANNEL}"

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Verify generated client remains the qualified contract
        run: |
          bun repo openapi generate
          git diff --exit-code -- package/api-client/src tooling/repo/fixtures
          bun run repo check openapi

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@maya-invest"

      - name: Build and publish client
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bun --filter @maya-invest/edaya-api-client build
          node .github/scripts/publish-client.mjs package/api-client "$CHANNEL"
