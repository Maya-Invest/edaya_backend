name: Publish API client

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: false
    outputs:
      channel:
        description: Published GitHub Packages dist-tag (staging, production, or sanitized branch name)
        value: ${{ jobs.publish.outputs.channel }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Resolve channel
        id: meta
        run: |
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            main|master)
              CHANNEL=production
              ;;
            *)
              CHANNEL="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
              if [ -z "$CHANNEL" ]; then CHANNEL=staging; fi
              ;;
          esac
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Publishing @maya-invest/edaya-api-client with tag ${CHANNEL}"

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Export and generate client
        run: bun repo openapi generate

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@maya-invest"

      - name: Build and publish client
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bun --filter @maya-invest/edaya-api-client build
          node .github/scripts/publish-client.mjs package/api-client "$CHANNEL"
          bun --filter @maya-invest/edaya-identity-client build
          node .github/scripts/publish-client.mjs package/identity-client "$CHANNEL"
