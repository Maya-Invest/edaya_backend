name: Checkout identity client
description: "Places Maya-Invest/edaya_identity at ../edaya_identity so bun can resolve the file: identity-client link."

inputs:
  ref:
    description: Explicit identity commit or branch
    required: true
  token:
    description: GitHub token that can read Maya-Invest/edaya_identity
    required: true

runs:
  using: composite
  steps:
    - name: Checkout edaya_identity
      uses: actions/checkout@v5
      with:
        repository: Maya-Invest/edaya_identity
        ref: ${{ inputs.ref }}
        path: .ci/edaya_identity
        token: ${{ inputs.token }}

    - name: Link identity as a sibling checkout
      shell: bash
      run: |
        set -euo pipefail
        dest="$(dirname "$GITHUB_WORKSPACE")/edaya_identity"
        rm -rf "$dest"
        ln -sfn "$GITHUB_WORKSPACE/.ci/edaya_identity" "$dest"
        test -f "$dest/package/identity-client/package.json"
