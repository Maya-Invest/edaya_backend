name: Backend setup
description: Check immutable checkout identity, install pinned Bun and frozen dependencies.
inputs:
  source_sha:
    required: true
    description: Immutable source commit
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - name: Restore Bun package cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.github/actions/setup/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-
    - shell: bash
      run: bun install --ignore-scripts --frozen-lockfile
