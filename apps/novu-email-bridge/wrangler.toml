name = "edaya-novu-email-bridge"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

[dev]
port = 9997

# Secrets: NOVU_EMAIL_WEBHOOK_SECRET (HMAC key from Novu Email Webhook integration)
# Optional: DEFAULT_FROM_NAME (display name when Novu sends from as bare email)

[[send_email]]
name = "EMAIL"

[env.staging]
name = "edaya-novu-email-bridge-staging"

[[env.staging.send_email]]
name = "EMAIL"

[[env.staging.routes]]
pattern = "novu-email-staging.edaya.softilab.dev"
custom_domain = true

[env.production]
name = "edaya-novu-email-bridge"

[[env.production.send_email]]
name = "EMAIL"

[[env.production.routes]]
pattern = "novu-email.edaya.softilab.dev"
custom_domain = true
