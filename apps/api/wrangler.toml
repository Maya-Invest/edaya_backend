name = "edaya-api"
main = "src/entries/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[[rules]]
type = "Text"
globs = [
  "**/*.txt",
  "**/*.html"
]
fallthrough = true

[alias]
"@/runtime/resolve-api-runtime" = "./src/runtime/worker/resolve-api-runtime.ts"

[dev]
port = 9999

[vars]
NODE_ENV = "development"
LOG_LEVEL = "info"
RUNTIME = "worker"
BETTER_AUTH_URL = "http://localhost:9999"
TRUSTED_ORIGINS = "http://localhost:5173,http://localhost:4173"
R2_BUCKET_NAME = "edaya-files-dev"
ALLOW_PUBLIC_SCHOOL_REGISTRATION = "true"

# Secrets and connection strings belong in `.dev.vars` (local) or the Worker dashboard (deployed).
# Staging (`wrangler deploy --env staging`):
#   Replace placeholder Hyperdrive + D1 IDs below before first deploy — see docs/deploy-staging.md
#   Required secret: BETTER_AUTH_SECRET (unique from production)
# Production (`wrangler deploy --env production`):
#   Required secret: BETTER_AUTH_SECRET
#   Before first deploy: run `bun run db:migrate:dev` (Neon school DB) and `bun run db:migrate:auth:remote` (Better Auth D1)
# Optional: DATABASE_URL (Node / wrangler fallback), GRANTS_CACHE_TTL_MS
# Optional: NOVU_SECRET_KEY, NOVU_API_URL, NOVU_WEBHOOK_SECRET (Novu Cloud)
# R2 file storage uses the S3-compatible API (@edaya/adaptor-r2), not [[r2_buckets]] bindings.
# Per env: R2_BUCKET_NAME in [vars] below; secrets in .dev.vars / Worker dashboard:
#   R2_ACCOUNT_ID, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#
# Hyperdrive local origin DB — loaded by `wrangler dev --env-file .dev.vars` (see dev:worker script).
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgresql://...

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "62c00eeda7d047fc9951daf7db430070"
# Do not commit credentials here. Set localConnectionString via the env var above or `.dev.vars`.

[[d1_databases]]
binding = "AUTH_DB"
database_name = "edaya"
database_id = "8686559f-38ed-4ce3-9580-81b3cf2e95b9"
migrations_dir = "../../package/adaptor-auth/drizzle/auth"

# Production (`wrangler deploy --env production`):

[env.production]
name = "edaya-api"

[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
RUNTIME = "worker"
BETTER_AUTH_URL = "https://api.edaya.softilab.dev"
TRUSTED_ORIGINS = "https://app.edaya.softilab.dev"
COOKIE_DOMAIN = "softilab.dev"
ALLOW_PUBLIC_SCHOOL_REGISTRATION = "true"
R2_BUCKET_NAME = "edaya-files-production"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "62c00eeda7d047fc9951daf7db430070"

[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "edaya"
database_id = "8686559f-38ed-4ce3-9580-81b3cf2e95b9"
migrations_dir = "../../package/adaptor-auth/drizzle/auth"

[[env.production.routes]]
pattern = "api.edaya.softilab.dev"
custom_domain = true

# Staging (`wrangler deploy --env staging`):

[env.staging]
name = "edaya-api-staging"

# Replace with staging Hyperdrive config ID (Neon staging branch) before first deploy.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "c6b9a94e449647d78f7c49591ba301e6"

[env.staging.vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
RUNTIME = "worker"
BETTER_AUTH_URL = "https://api-staging.edaya.softilab.dev"
TRUSTED_ORIGINS = "https://app-staging.edaya.softilab.dev"
COOKIE_DOMAIN = "softilab.dev"
ALLOW_PUBLIC_SCHOOL_REGISTRATION = "true"
R2_BUCKET_NAME = "edaya-files-staging"

# Replace with staging D1 database ID after `wrangler d1 create edaya-auth-staging`.
[[env.staging.d1_databases]]
binding = "AUTH_DB"
database_name = "edaya-auth-staging"
database_id = "2e55cf53-1b89-453f-ac17-3aab83fd8488"
migrations_dir = "../../package/adaptor-auth/drizzle/auth"

[[env.staging.routes]]
pattern = "staging.api.edaya.softilab.dev"
custom_domain = true
